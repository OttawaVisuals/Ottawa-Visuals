name: Update StatCan Vehicle Registrations

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert data
        run: |
          python3 - <<'EOF'
          import urllib.request, json, csv, os

          url = "https://www150.statcan.gc.ca/t1/wds/sdmx/statcan/rest/data/DF_20100025/1+2199+2208.5+6+1+7.2+3+4+5.1"
          req = urllib.request.Request(url, headers={"Accept": "application/vnd.sdmx.data+json;version=1.0.0-wd"})
          
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          # Parse SDMX-JSON structure
          structure = data["structure"]
          dim_names = [d["name"] for d in structure["dimensions"]["series"]]
          dim_values = [d["values"] for d in structure["dimensions"]["series"]]
          time_values = [t["name"] for t in structure["dimensions"]["observation"][0]["values"]]

          rows = []
          for series_key, series in data["dataSets"][0]["series"].items():
              indices = [int(i) for i in series_key.split(":")]
              dim_labels = {dim_names[i]: dim_values[i][indices[i]]["name"] for i in range(len(dim_names))}
              for obs_idx, obs in series["observations"].items():
                  row = dict(dim_labels)
                  row["period"] = time_values[int(obs_idx)]
                  row["value"] = obs[0]
                  rows.append(row)

          os.makedirs("Vehicles", exist_ok=True)

          with open("Vehicles/statcan-vehicle-registrations.csv", "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          with open("Vehicles/statcan-vehicle-registrations.json", "w") as f:
              json.dump(rows, f, indent=2)

          print(f"Exported {len(rows)} rows")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Vehicles/statcan-vehicle-registrations.csv Vehicles/statcan-vehicle-registrations.json
          git diff --staged --quiet || git commit -m "chore: update StatCan vehicle registrations $(date +'%Y-%m-%d')"
          git push
