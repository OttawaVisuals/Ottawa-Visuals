name: Update StatCan Data

on:
  schedule:
    - cron: '0 10 * * 1'  # Every Monday at 10am UTC (StatCan releases quarterly)
  workflow_dispatch:        # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas

      - run: python Vehicles/VehiclesStats.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Vehicles/statcan_vehicle_registrations.csv
          git diff --staged --quiet || git commit -m "Update StatCan vehicle registrations data"
          git push
