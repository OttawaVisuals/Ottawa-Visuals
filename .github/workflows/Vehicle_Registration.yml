name: Update StatCan Vehicle Registrations

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data as CSV
        run: |
          curl -s -k \
            -H "Accept: text/csv" \
            "https://www150.statcan.gc.ca/t1/wds/sdmx/statcan/v1/rest/data/DF_20100025/1+2199+2208.5+6+1+7.2+3+4+5.1" \
            -o Vehicles/statcan-vehicle-registrations.csv

      - name: Convert CSV to JSON
        run: |
          python3 -c "
          import csv, json
          with open('Vehicles/statcan-vehicle-registrations.csv', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          with open('Vehicles/statcan-vehicle-registrations.json', 'w') as f:
              json.dump(rows, f, indent=2)
          print(f'Exported {len(rows)} rows')
          "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Vehicles/statcan-vehicle-registrations.csv Vehicles/statcan-vehicle-registrations.json
          git diff --staged --quiet || git commit -m "chore: update StatCan vehicle registrations $(date +'%Y-%m-%d')"
          git push
