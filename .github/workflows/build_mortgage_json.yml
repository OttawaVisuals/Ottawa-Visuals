name: Build Mortgage JSON

on:
  push:
    paths:
      - 'data/**'               # Ottawa CSVs updated by weekly workflow
      - 'Mortgage/Static/**'    # Static CSVs updated manually
  workflow_dispatch:            # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch CPI data (StatCan 18-10-0004-01)
        run: |
          curl -L "https://www150.statcan.gc.ca/t1/tbl1/en/dtbl/downloadTbl?dataPackageId=18-10-0004-01" -o data/cpi_raw.zip
          unzip -o data/cpi_raw.zip -d data/cpi_extracted/
          mv data/cpi_extracted/18100004.csv data/cpi_canada.csv
          rm -rf data/cpi_raw.zip data/cpi_extracted/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Build JSON files
        run: python Mortgage/Pipeline/build_json.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Mortgage/JSON/ data/cpi_canada.csv
          git diff --cached --quiet || git commit -m "Rebuild mortgage JSON $(date +%Y-%m-%d)"
          git push
