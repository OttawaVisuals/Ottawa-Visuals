name: Collect Ottawa Data (traffic + transit)

# Triggered every 5 min by the Cloudflare Worker in cloudflare-worker/ via the
# workflow_dispatch API. GitHub's own `schedule:` is throttled on this account,
# and dispatch events are not. Replaces the Raspberry Pi cron (Traffic/PI_SETUP.md).
#
# Each pollers self-gates its cadence (peak / off-peak / overnight), so most
# runs are cheap no-ops. Readings are appended to the CSVs, kept between runs in
# the Actions cache, and committed to main at most once an hour so git history
# doesn't balloon (the CSVs are multi-MB; a commit per run would add GBs/week).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

env:
  # Files the pollers append to. Only these are cached between runs; other
  # workflows write the rest of Traffic/data (city/, derived/, ...).
  SPOOL_PATHS: |
    Traffic/data/corridor_travel_times.csv
    Traffic/data/segment_speeds.csv
    Traffic/data/incidents_summary.csv
    Traffic/data/parking_lots.csv
    Traffic/data/parking_summary.csv
    Traffic/data/events_log.csv
    Traffic/data/events_summary.csv
    Traffic/data/events_active.json
    Traffic/data/cameras.csv
    Traffic/data/ops_collision_releases.csv
    Traffic/data/ops_news_seen.json
    Traffic/data/ctv_crash_headlines.csv
    Traffic/data/ctv_crashes_state.json
    Traffic/data/tomtom_ottawa_hourly.csv
    Traffic/data/tomtom_live_state.json
    Traffic/data/flow_tiles_summary.csv
    Traffic/data/incident_tiles_summary.csv
    Traffic/data/incident_tiles_log.csv
    Traffic/data/incident_tiles_state.json
    Traffic/data/reachable_range.csv
    Traffic/data/reachable_range.jsonl
    Traffic/data/matrix_times.csv
    OC_Transpo/rt_data/trip_updates_summary.csv
    OC_Transpo/rt_data/vehicle_positions_summary.csv
  # Same idea, own cache: changing SPOOL_PATHS changes that cache's version,
  # so the next restore would miss and lose up to an hour of readings.
  STATE_PATHS: |
    OC_Transpo/rt_data/route_daily.csv
    OC_Transpo/rt_data/cancellations_daily.csv
    OC_Transpo/rt_data/cancel_state.json

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Newest spool wins over the checkout: it holds readings not yet
      # committed. Safe because only this workflow writes these files.
      - name: Restore un-committed readings
        id: spool
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SPOOL_PATHS }}
          key: collect-spool-none
          restore-keys: collect-spool-

      - name: Restore transit day state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_PATHS }}
          key: transit-state-none
          restore-keys: transit-state-

      # Timetable index for on-time computation (poll_gtfsrt.py compares predicted
      # arrivals with the schedule). Keyed on the published zip's ETag, so it is
      # rebuilt (~30 s) only when OC Transpo publishes a new timetable or the
      # index format changes (bump the v3 in the key). Kept in
      # the Actions cache, never committed. Any failure here just leaves the
      # delay columns empty for that run. On a new timetable the previous index
      # is restored first (restore-keys), so the build can carry its trips over:
      # the evening before a new feed starts still runs the old one.
      - name: Timetable version
        id: gtfs
        continue-on-error: true
        run: |
          etag=$(curl -sfI --max-time 20 "https://oct-gtfs-emasagcnfmcgeham.z01.azurefd.net/public-access/GTFSExport.zip" \
                 | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}' | tr -cd 'A-Za-z0-9')
          echo "etag=${etag:-unknown-$(date -u +%G-W%V)}" >> "$GITHUB_OUTPUT"

      - name: Restore timetable index
        id: sched
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: OC_Transpo/schedule_cache/schedule_index.sqlite
          key: gtfs-index-v3-${{ steps.gtfs.outputs.etag }}
          restore-keys: gtfs-index-v3-

      - name: Build timetable index
        id: build
        if: steps.sched.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python OC_Transpo/scripts/build_schedule_index.py --etag "${{ steps.gtfs.outputs.etag }}"

      # Only a fresh build: a failed one leaves the restored older index, which
      # must not be saved under the new ETag.
      - name: Save timetable index
        if: steps.build.outcome == 'success' && hashFiles('OC_Transpo/schedule_cache/schedule_index.sqlite') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: OC_Transpo/schedule_cache/schedule_index.sqlite
          key: gtfs-index-v3-${{ steps.gtfs.outputs.etag }}

      - name: Poll
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OCTRANSPO_API_KEY: ${{ secrets.OCTRANSPO_API_KEY }}
          ONTARIO_511_KEY: ${{ secrets.ONTARIO_511_KEY }}
          OCTRANSPO_SCHEDULE_DB: OC_Transpo/schedule_cache/schedule_index.sqlite
        run: |
          python Traffic/scripts/poll_traffic.py
          python Traffic/scripts/poll_parking.py || echo "poll_parking failed (non-fatal)"
          python Traffic/scripts/poll_events.py || echo "poll_events failed (non-fatal)"
          python Traffic/scripts/poll_ops_news.py || echo "poll_ops_news failed (non-fatal)"
          python Traffic/scripts/poll_ctv_crashes.py || echo "poll_ctv_crashes failed (non-fatal)"
          python Traffic/scripts/poll_tomtom_live.py || echo "poll_tomtom_live failed (non-fatal)"
          python Traffic/scripts/poll_tiles.py || echo "poll_tiles failed (non-fatal)"
          python Traffic/scripts/poll_incident_tiles.py || echo "poll_incident_tiles failed (non-fatal)"
          python Traffic/scripts/poll_reach.py || echo "poll_reach failed (non-fatal)"
          python Traffic/scripts/poll_matrix.py || echo "poll_matrix failed (non-fatal)"
          python OC_Transpo/scripts/poll_gtfsrt.py

      - name: Save readings to spool
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SPOOL_PATHS }}
          key: collect-spool-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save transit day state
        if: always() && hashFiles('OC_Transpo/rt_data/cancel_state.json', 'OC_Transpo/rt_data/route_daily.csv') != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_PATHS }}
          key: transit-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Commit each collector at most once an hour (>=55 min since its last
      # readings commit), keeping the Pi's "traffic: readings" / "transit:
      # readings" messages so collector-heartbeat.yml keeps working.
      - name: Commit hourly
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch --quiet --depth=200 origin main
          now=$(date -u +%s)
          due () { # $1 = commit message prefix
            last=$(git log origin/main -1 --grep="^$1" --format=%ct || true)
            [ -z "$last" ] || [ $((now - last)) -ge 3300 ]
          }
          stamp=$(date -u +'%Y-%m-%d %H:%M UTC')

          if due "traffic: readings"; then
            python Traffic/scripts/build_history.py || echo "build_history failed (non-fatal)"
            git add Traffic/data/
            git diff --cached --quiet || git commit -q -m "traffic: readings $stamp"
          fi
          if due "transit: readings"; then
            python OC_Transpo/scripts/fetch_otranspo_daily.py || echo "fetch_otranspo_daily failed (non-fatal)"
            python OC_Transpo/scripts/build_history_transit.py || echo "build_history_transit failed (non-fatal)"
            git add OC_Transpo/rt_data/
            git diff --cached --quiet || git commit -q -m "transit: readings $stamp"
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase --autostash -q origin main
            git push -q origin HEAD:main
          fi
