name: Daily PWHL Data Update

on:
  schedule:
    # Run daily at 6 AM UTC (2 AM ET / 11 PM PT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore play-by-play cache
        # pwhl_pbp.csv is 27 MB and rewritten daily, so it's no longer committed
        # (see .gitignore). Cache it between runs so daily_update.R can do
        # incremental PBP fetches instead of re-pulling every game. The run_id
        # key never hits on restore, so restore-keys falls back to the newest
        # prior cache and the post-step saves a fresh copy each run.
        uses: actions/cache@v4
        with:
          path: PWHL/data/pwhl_pbp.csv
          key: pwhl-pbp-${{ github.run_id }}
          restore-keys: |
            pwhl-pbp-

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev
      
      - name: Install R packages
        env:
          # remotes::install_github() falls back to a bundled shared PAT for
          # anonymous GitHub API calls when GITHUB_PAT/GH_PAT isn't set, and
          # that shared token is routinely dead ("Bad credentials", 401).
          # Use the job's own token instead -- it has read access to public
          # repos, which is all install_github needs.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "dplyr", "purrr", "readr", "tibble", "rvest", "stringr", "glue", "remotes"))'
          Rscript -e 'remotes::install_github("sportsdataverse/fastRhockey")'
      
      - name: Run daily update script
        run: |
          Rscript PWHL/scripts/daily_update.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dashboard JSON
        # Aggregates the raw CSVs into PWHL/data/json/*.json, which pwhl.html
        # actually fetches. Without this the dashboard goes stale. Stdlib only,
        # so no pip install is needed.
        run: python PWHL/scripts/build_dashboard_json.py

      - name: Upload play-by-play artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwhl-pbp
          path: PWHL/data/pwhl_pbp.csv
          if-no-files-found: ignore

      - name: Commit and push changes
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Adds the raw CSVs and the newly built json/ dir; pwhl_pbp.csv is
          # gitignored so a directory add skips it silently.
          git add PWHL/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update PWHL data - $(date +'%Y-%m-%d %H:%M:%S UTC')" && git pull --rebase origin main && git push)