name: Collect Ottawa Traffic

on:
  # NOTE: collection runs on the Raspberry Pi (see Traffic/PI_SETUP.md), not here.
  # GitHub Actions throttles this account's scheduled runs by 3-4 hours, so a
  # 15-min `schedule:` cron never fires reliably. The Pi's real cron does it.
  # This workflow is kept only for manual test runs via the Actions "Run workflow"
  # button; re-enable the schedule below only if collection moves back to Actions.
  #   schedule:
  #     - cron: '*/15 * * * *'
  workflow_dispatch: # manual test run (script honors the same peak/hourly gate)

# Avoid overlapping runs stepping on each other's commit/push.
concurrency:
  group: collect-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll TomTom
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python Traffic/scripts/poll_traffic.py

      - name: Commit and push new readings
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Traffic/data/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "traffic: readings $(date -u +'%Y-%m-%d %H:%M UTC')" && \
             git pull --rebase origin main && git push)
