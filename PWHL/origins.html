<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PWHL player origins — Ottawa Visuals</title>
<meta name="description" content="Explore PWHL players’ birthplaces on an interactive map."/>
<link rel="icon" type="image/png" href="../assets/img/avatar.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="pwhl-teams.js?v=usability-1"></script>
<script src="pwhl-core.js?v=usability-1"></script>
<script>(function(){let t;try{t=localStorage.getItem('ov-theme')}catch(e){};document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))})()</script>
<link rel="stylesheet" href="pwhl.css?v=mobile-comparisons-1"/>
<link rel="stylesheet" href="origins.css?v=origins-1"/>
<link rel="stylesheet" href="../assets/site-theme.css"/>
<script src="../assets/site-theme.js"></script>
</head>
<body class="origins-page">
<div id="pwhl-header"></div><script>PWHL.header('origins')</script>
<main class="report">
  <section class="hero origins-hero">
    <span class="eyebrow">PWHL · player origins</span>
    <h1>Where players are from</h1>
    <div class="origins-toolbar">
      <p id="origins-summary">Loading birthplace data…</p>
      <label for="origins-season">Season <select class="ov-select" id="origins-season"></select></label>
    </div>
  </section>
  <section class="card origins-map-card">
    <div id="origins-map" role="application" aria-label="Zoomable map of PWHL player birthplaces"></div>
    <p class="origins-attribution-note">Birthplace coordinates are town or city reference points. Map tiles and geodata © OpenStreetMap contributors, ODbL.</p>
  </section>
  <p id="origins-status" class="origins-status" role="status" hidden></p>
</main>
<footer><span>Ottawa Visuals</span><span>Player data: PWHL / HockeyTech · Map data: OpenStreetMap</span></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="origins.js?v=usability-1"></script>
</body>
</html>
